<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loyalty</title>
<link rel="preload" href="/img/locker.svg" as="image">
<link rel="preload" href="/img/military.svg" as="image">
<link rel="preload" href="/img/firstresponders.svg" as="image">
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
    --blue:#1DA1F2; --blue-100:#e1f4fe; --blue-200:#b8e5fc;
    --orange:#FF6E4A; --orange-100:#ffe6e0; --orange-200:#ffb8a3;
    --row-even:#f8fafc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:auto;padding:16px 16px 120px}
  .controls{display:grid;gap:12px;margin-bottom:8px}

  /* Search */
  .search{display:flex;align-items:center;gap:10px;background:var(--card);
          border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .search input{width:100%;border:0;outline:0;background:transparent;font-size:16px}

  /* Pills */
  .pills{display:flex;gap:12px}
  .pill{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;
        border-radius:14px;padding:12px 14px;cursor:pointer;border:1px solid var(--line)}
  .pill.lock{background:var(--blue-100); border-color:var(--blue-200)}
  .pill.reg {background:var(--orange-100); border-color:var(--orange-200)}
  .chev{opacity:.65}
  .dot{width:12px;height:12px;border-radius:50%}
  .blue{background:var(--blue)} .orange{background:var(--orange)}

  /* Dropdowns */
  .dd{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;
      margin-top:6px;overflow:hidden}
  .dd.open{display:block}
  .dd-item{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;
           padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
  .dd-item:hover{background:#f1f5f9}
  .dd .muted{color:var(--muted);cursor:default}
  .locker-num{justify-self:start;min-width:48px;text-align:center;
              border:1px solid var(--blue-200);background:var(--blue-100);color:var(--blue);
              padding:4px 8px;border-radius:10px;font-weight:700}
  .dd-name{font-weight:700}
  .dd-nick{font-size:12px;color:var(--muted);margin-top:2px}

  /* Table */
  .table{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .thead,.row{display:grid;grid-template-columns:1fr 88px 110px;align-items:center}
  .thead{padding:12px 16px;background:#eef2ff;font-weight:800}
  .row{padding:14px 16px;border-top:1px solid var(--line)}
  .row:nth-child(even){background:var(--row-even)}
  .row.lock{background:var(--blue-100)}
  .row.reg {background:var(--orange-100)}

  .name{display:flex;align-items:center;gap:10px;cursor:pointer}
  .badge{width:20px;height:20px;flex:0 0 20px;background-size:contain;
         background-repeat:no-repeat;background-position:center}
  .sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .val,.last{font-weight:500}

  /* Error */
  .err{margin-top:12px;padding:12px 14px;border:1px solid #fecaca;background:#fff1f2;
       color:#991b1b;border-radius:12px}

  /* Modal */
  .backdrop{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;
            align-items:center;justify-content:center;z-index:50}
  .backdrop.show{display:flex}
  .sheet{width:min(92vw,540px);max-height:80vh;overflow:auto;background:var(--card);
         border-radius:16px;border:1px solid var(--line);padding:18px 18px 10px;
         box-shadow:0 20px 60px rgba(2,6,23,.25);position:relative}
  .sheet h3{margin:0 28px 6px 0}
  .close{position:absolute;right:18px;top:14px;border:0;background:#eff4ff;color:#1f2937;
         width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
  .dl{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .dl b{color:var(--muted);font-weight:600}

  @media (max-width:540px){.thead,.row{grid-template-columns:1fr 64px 88px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <!-- search row -->
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.2-4.2M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" stroke="#64748b" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" placeholder="Search" />
      </div>
      <!-- colored buttons -->
      <div class="pills">
        <button id="pillLock" class="pill lock" type="button">
          <span><span class="dot blue"></span> Lockers</span><span class="chev">▾</span>
        </button>
        <button id="pillReg"  class="pill reg"  type="button">
          <span><span class="dot orange"></span> Regulars</span><span class="chev">▾</span>
        </button>
      </div>
      <div id="ddLock" class="dd"></div>
      <div id="ddReg"  class="dd"></div>
    </div>

    <div class="table">
      <div class="thead"><div>Name</div><div>Pts</div><div>Last Visit</div></div>
      <div id="rows"></div>
    </div>

    <div id="err" class="err" style="display:none"></div>
  </div>

  <!-- centered modal -->
  <div id="backdrop" class="backdrop" role="dialog" aria-modal="true">
    <div class="sheet">
      <button class="close" id="close">×</button>
      <h3 id="mName">Customer</h3>
      <div class="dl"><b>Nickname</b><span id="mNick">—</span></div>
      <div class="dl"><b>Phone</b><a id="mPhone" href="#">—</a></div>
      <div class="dl"><b>Email</b><a id="mEmail" href="#">—</a></div>
      <div class="dl"><b>Birthday</b><span id="mBday">—</span></div>
      <div class="dl"><b>Points</b><span id="mPts">0</span></div>
    </div>
  </div>

<script>
/* -------- CSV parser (handles quotes/commas) -------- */
function parseCSV(text){
  const rows=[]; let i=0, field='', row=[], inQ=false;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"' && text[i+1]==='"'){ field+='"'; i+=2; continue; }
      if(c==='"'){ inQ=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c===','){ row.push(field); field=''; i++; continue; }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=c; i++;
  }
  row.push(field); rows.push(row);
  return rows;
}

/* -------- helpers -------- */
const badgeURL={locker:'/img/locker.svg',military:'/img/military.svg',responder:'/img/firstresponders.svg'};
const truthy=v=>v!=null && String(v).trim().toLowerCase()!=='' && !['0','false','no','n'].includes(String(v).trim().toLowerCase());
const hasDigits=v=>/\d/.test(String(v||''));
const getLockerNum=v=>{ const m=String(v||'').match(/\d+/); return m?parseInt(m[0],10):NaN; };

function normalizeHeaders(h){
  const map={
    'first name':'first_name','first':'first_name',
    'last name':'last_name','last':'last_name',
    'nickname “aka”':'aka','nickname':'aka','aka':'aka',
    'email':'email','phone':'phone','birthday':'birthday',
    'last purchase':'lastPurchase','last':'lastPurchase',
    'rewards':'points','points':'points',
    'locker #':'locker','locker':'locker',
    'regular':'regular','military':'military','first responder':'responder'
  };
  return h.map(x=>map[x.trim().toLowerCase()]||x.trim());
}
function rowsToObjects(matrix){
  if(matrix.length<2) return [];
  const head=normalizeHeaders(matrix[0]);
  return matrix.slice(1)
    .filter(r=>r.some(c=>String(c||'').trim()!==''))
    .map((r,i)=>{
      const obj={id:i+1};
      head.forEach((k,idx)=>{ obj[k]=(r[idx]??'').toString().trim(); });
      return obj;
    });
}
function fmtLast(dt){
  if(!dt) return '—';
  const d=new Date(dt); if(isNaN(d)) return '—';
  const now=new Date(); const days=(now-d)/86400000;
  const moFull=d.toLocaleString('en-US',{month:'long'});
  if(days<180) return `${d.getMonth()+1}/${d.getDate()}`;
  if(days<365) return moFull;
  if(days>=730) return String(d.getFullYear());
  return 'Year +';
}

/* -------- state -------- */
let PEOPLE=[], FILTERED=[];
const rowsEl=document.getElementById('rows'), qEl=document.getElementById('q');
const ddLock=document.getElementById('ddLock'), ddReg=document.getElementById('ddReg');
const errEl=document.getElementById('err');

/* -------- renderers -------- */
function render(list){
  rowsEl.innerHTML='';
  const frag=document.createDocumentFragment();
  list.forEach(p=>{
    const isLocker = hasDigits(p.locker);
    const isRegular = !isLocker && truthy(p.regular);

    const row=document.createElement('div');
    row.className='row' + (isLocker ? ' lock' : (isRegular ? ' reg' : ''));

    const nm=document.createElement('div'); nm.className='name';
    const badge=document.createElement('span'); badge.className='badge';
    if(isLocker){badge.style.backgroundImage=`url(${badgeURL.locker})`; nm.appendChild(badge);}
    else if(truthy(p.military)){badge.style.backgroundImage=`url(${badgeURL.military})`; nm.appendChild(badge);}
    else if(truthy(p.responder)){badge.style.backgroundImage=`url(${badgeURL.responder})`; nm.appendChild(badge);}

    const box=document.createElement('div');
    box.innerHTML=`<strong>${(p.last_name||'').trim()} ${(p.first_name||'').trim()}</strong>${p.aka?`<span class="sub">“${p.aka}”</span>`:''}`;
    nm.appendChild(box);
    nm.onclick=()=>openModal(p);

    const pts=document.createElement('div'); pts.className='val'; pts.textContent=Number(p.points||0);
    const last=document.createElement('div'); last.className='last'; last.textContent=fmtLast(p.lastPurchase);

    row.appendChild(nm); row.appendChild(pts); row.appendChild(last);
    frag.appendChild(row);
  });
  rowsEl.appendChild(frag);
}

function renderDropdowns(list){
  // Lockers sorted by locker number
  const locks=list
    .filter(p=>hasDigits(p.locker))
    .map(p=>({...p, _lockerNum:getLockerNum(p.locker)}))
    .sort((a,b)=> (a._lockerNum||Infinity)-(b._lockerNum||Infinity)
                  || (a.last_name||'').localeCompare(b.last_name||'')
                  || (a.first_name||'').localeCompare(b.first_name||''));
  ddLock.innerHTML = locks.length
    ? locks.map(p=>`
        <div class="dd-item" data-id="${p.id}">
          <div class="locker-num">${isNaN(p._lockerNum)?'—':p._lockerNum}</div>
          <div>
            <div class="dd-name">${p.last_name||''} ${p.first_name||''}</div>
            ${p.aka?`<div class="dd-nick">“${p.aka}”</div>`:''}
          </div>
        </div>`).join('')
    : `<div class="dd-item muted">No lockers</div>`;

  // Regulars alpha
  const regs=list.filter(p=>!hasDigits(p.locker)&&truthy(p.regular))
                 .sort((a,b)=> (a.last_name||'').localeCompare(b.last_name||'')
                               || (a.first_name||'').localeCompare(b.first_name||''));
  ddReg.innerHTML = regs.length
    ? regs.map(p=>`
        <div class="dd-item" data-id="${p.id}">
          <div class="locker-num" style="visibility:hidden">—</div>
          <div>
            <div class="dd-name">${p.last_name||''} ${p.first_name||''}</div>
            ${p.aka?`<div class="dd-nick">“${p.aka}”</div>`:''}
          </div>
        </div>`).join('')
    : `<div class="dd-item muted">No regulars</div>`;

  // click-to-jump
  [...ddLock.querySelectorAll('.dd-item[data-id]'),...ddReg.querySelectorAll('.dd-item[data-id]')].forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.getAttribute('data-id');
      const idx=FILTERED.findIndex(p=>String(p.id)===String(id));
      if(idx>=0){
        const t=rowsEl.children[idx];
        t?.scrollIntoView({behavior:'smooth',block:'center'});
        t?.animate([{background:'#fffbd1'},{background:'transparent'}],{duration:900});
      }
    });
  });
}

/* -------- modal -------- */
const backdrop=document.getElementById('backdrop');
document.getElementById('close').onclick=()=>backdrop.classList.remove('show');
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('show'); });
function openModal(p){
  document.getElementById('mName').textContent=`${p.first_name||''} ${p.last_name||''}`.trim();
  document.getElementById('mNick').textContent=p.aka?`“${p.aka}”`:'—';
  const ph=(p.phone||'').trim(), em=(p.email||'').trim();
  const mPh=document.getElementById('mPhone'), mEm=document.getElementById('mEmail');
  if(ph){mPh.textContent=ph; mPh.href=`tel:${ph.replace(/\D+/g,'')}`} else {mPh.textContent='—'; mPh.removeAttribute('href')}
  if(em){mEm.textContent=em; mEm.href=`mailto:${em}`} else {mEm.textContent='—'; mEm.removeAttribute('href')}
  document.getElementById('mBday').textContent=p.birthday||'—';
  document.getElementById('mPts').textContent=Number(p.points||0);
  backdrop.classList.add('show');
}

/* -------- bootstrap: load CSV -------- */
(async function init(){
  try{
    const res = await fetch('/img/contacts.csv',{cache:'no-store'});
    if(!res.ok) throw new Error(`GET /img/contacts.csv → ${res.status}`);
    const txt = await res.text();
    const rows = parseCSV(txt);
    const objs = rowsToObjects(rows);
    // sort by last then first
    PEOPLE = objs.sort((a,b)=> (a.last_name||'').localeCompare(b.last_name||'')
                              || (a.first_name||'').localeCompare(b.first_name||''));
    FILTERED = PEOPLE.slice();
    render(FILTERED);
    renderDropdowns(PEOPLE);
    errEl.style.display='none';
  }catch(e){
    console.error(e);
    errEl.style.display='block';
    errEl.textContent = `Error loading contacts.csv: ${e.message}`;
  }
})();

/* -------- UI events -------- */
document.getElementById('pillLock').onclick=()=>ddLock.classList.toggle('open');
document.getElementById('pillReg').onclick =()=>ddReg.classList.toggle('open');
qEl.addEventListener('input', e=>{
  const s=e.target.value.trim().toLowerCase();
  FILTERED = !s ? PEOPLE : PEOPLE.filter(p=>{
    const hay=[p.first_name,p.last_name,p.aka,p.email,p.phone]
      .map(v=>String(v||'').toLowerCase()).join('|');
    return hay.includes(s);
  });
  render(FILTERED);
});
</script>
</body>
</html>
