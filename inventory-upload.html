<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload Inventory CSV</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px}
    .card{max-width:880px;margin:0 auto}
    table{border-collapse:collapse;width:100%;margin-top:16px}
    th,td{padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}
    th{background:#f3f4f6}
    .row{display:flex;gap:8px;align-items:center;margin:12px 0}
    button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .muted{color:#6b7280;font-size:14px}
    .err{color:#b91c1c;white-space:pre-wrap}
    .ok{color:#065f46}
  </style>
</head>
<body>
<div class="card">
  <h1>Upload Inventory CSV</h1>
  <div class="row">
    <input id="file" type="file" accept=".csv,text/csv" />
    <button id="saveBtn" disabled>Save to Netlify</button>
    <a href="/api/list-inventory" target="_blank" class="muted">View current saved CSV</a>
  </div>
  <div id="msg" class="muted"></div>
  <div id="preview"></div>
</div>
<script>
const $=s=>document.querySelector(s); let csv="";
$("#file").addEventListener("change", async e=>{
  const f=e.target.files?.[0]; csv=""; $("#preview").innerHTML=""; $("#msg").textContent="";
  if(!f){$("#saveBtn").disabled=true;return;}
  csv=await f.text(); $("#saveBtn").disabled=!csv.trim();
  const rows=csv.trim().split(/\r?\n/).slice(0,15).map(r=>r.split(","));
  const head=rows[0]??[]; const body=rows.slice(1);
  const th=head.map(h=>`<th>${h.replace(/</g,"&lt;")}</th>`).join("");
  const trs=body.map(r=>`<tr>${r.map(c=>`<td>${c.replace(/</g,"&lt;")}</td>`).join("")}</tr>`).join("");
  $("#preview").innerHTML=`<h3>Preview (first 15 rows)</h3><table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`;
});
$("#saveBtn").addEventListener("click", async ()=>{
  $("#msg").textContent="Saving…"; $("#saveBtn").disabled=true;
  try{
    const res=await fetch("/api/set-inventory",{method:"POST",headers:{"Content-Type":"text/csv"},body:csv});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.ok) throw new Error(data.error||res.statusText);
    $("#msg").innerHTML=`<span class="ok">Saved (${data.bytes} bytes) → ${data.saved}</span>`;
  }catch(e){ $("#msg").innerHTML=`<span class="err">Error: ${e.message}</span>`; }
  finally{ $("#saveBtn").disabled=false; }
});
</script>
</body>
</html>
