<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CigarOS2</title>
  <style>
    :root { --bg:#f2f2f2; }

    body{
      margin:0;
      background:var(--bg);
      font-family:sans-serif;
    }

    .home-wrap{ max-width:900px; margin:0 auto; padding:20px 12px 40px; }
    .logo-wrap{ display:flex; justify-content:center; margin:8px 0 16px; }
    .logo-wrap img{ height:72px; width:auto; display:block; }

    /* tighter grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(2,1fr);
      gap:20px 24px; /* smaller spacing */
      justify-items:center;
    }

    .tile{
      display:inline-grid;
      place-items:center;
      background:transparent;
      text-decoration:none;
    }
    .tile > img{
      display:block;
      width:140px;   /* larger default size */
      height:140px;
    }

    .tile--hub{ grid-column:1 / -1; justify-self:center; margin-top:12px; }
    .tile--hub > img{ width:200px; height:auto; }

    @media (min-width:720px){
      .logo-wrap img{ height:84px; }
      .tile > img{ width:160px; height:160px; }
      .tile--hub > img{ width:240px; }
      .grid{ gap:28px 36px; } /* a touch more spacing on large screens */
    }
  </style>
</head>
<body>
  <div class="home-wrap">
    <div class="logo-wrap">
      <img src="img/logo.svg" alt="Shop logo">
    </div>

    <div class="grid">
      <a class="tile" href="pos.html"><img src="img/icons/pos.svg" alt="POS"></a>
      <a class="tile" href="today.html"><img src="img/icons/today.svg" alt="Today"></a>
      <a class="tile" href="loyalty.html"><img src="img/icons/loyalty.svg" alt="Loyalty"></a>
      <a class="tile" href="reports.html"><img src="img/icons/reports.svg" alt="Reports"></a>
      <a class="tile" href="learn.html"><img src="img/icons/learn.svg" alt="Learn"></a>
      <a class="tile" href="news.html"><img src="img/icons/news.svg" alt="News"></a>
      <a class="tile tile--hub" href="hub.html"><img src="img/icons/hub.svg" alt="Hub"></a>
    </div>
  </div>
</body>
</html>
