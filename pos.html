<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload Inventory CSV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --card:#fff; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --accent:#2563eb; }
    *{box-sizing:border-box} body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);margin:0;padding:24px;color:#0f172a}
    .wrap{max-width:920px;margin:0 auto;background:var(--card);border-radius:14px;padding:24px 24px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.03)}
    h1{font-size:28px;margin:0 0 8px} p.sub{margin:0 0 16px;color:var(--muted)}
    .row{display:flex;gap:12px;align-items:center;margin:8px 0 16px}
    input[type=file]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
    button.primary{background:#111827;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
    button.primary:disabled{opacity:.6;cursor:not-allowed}
    .preview{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
    th{background:#f9fafb;text-align:left;font-weight:700}
    tfoot td{padding:12px;color:var(--muted)}
    .links{display:flex;gap:16px;margin:12px 0 8px}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
    .status{margin:8px 0 16px;font-weight:600}
    .ok{color:#059669}.err{color:#dc2626}
  </style>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>Upload Inventory CSV</h1>
    <p class="sub">Pick your latest inventory CSV. We’ll save it so the POS always loads the newest version (no redeploy needed).</p>

    <div class="row">
      <input id="file" type="file" accept=".csv" />
      <button id="save" class="primary" disabled>Save to Netlify</button>
    </div>

    <div class="status" id="status"></div>

    <div class="links">
      <a href="/.netlify/functions/get-inventory" target="_blank">View current saved CSV</a>
      <a href="/pos.html" id="reload">Reload uploader</a>
    </div>

    <div class="preview" id="preview" hidden>
      <table id="tbl"></table>
    </div>
    <div style="height:8px"></div>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const saveBtn = document.getElementById('save');
    const statusEl = document.getElementById('status');
    const previewBox = document.getElementById('preview');
    const tbl = document.getElementById('tbl');

    let csvText = '';

    fileInput.addEventListener('change', async () => {
      statusEl.textContent = '';
      previewBox.hidden = true;
      tbl.innerHTML = '';
      csvText = '';

      const file = fileInput.files?.[0];
      if (!file) { saveBtn.disabled = true; return; }

      // Read file as text
      csvText = await file.text();

      // Preview first ~200 rows
      const parsed = Papa.parse(csvText, { header: true, preview: 200 });
      const { data, meta } = parsed;

      // Build preview table
      const headers = meta.fields || Object.keys(data[0] || {});
      const head = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
      const rows = data.map(r => `<tr>${headers.map(h => `<td>${(r[h] ?? '')}</td>`).join('')}</tr>`).join('');
      const body = `<tbody>${rows}</tbody>`;
      const foot = `<tfoot><tr><td colspan="${headers.length}">Showing ${data.length} rows (preview)</td></tr></tfoot>`;
      tbl.innerHTML = head + body + foot;

      previewBox.hidden = false;
      saveBtn.disabled = false;
    });

    saveBtn.addEventListener('click', async () => {
      if (!csvText) return;
      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'status';

      try {
        const res = await fetch('/.netlify/functions/set-inventory', {
          method: 'POST',
          headers: { 'Content-Type': 'text/csv; charset=utf-8' },
          body: csvText
        });

        const text = await res.text();
        let msg = text;
        try { msg = JSON.parse(text); } catch {}
        if (!res.ok || msg.ok !== true) throw new Error(typeof msg === 'string' ? msg : (msg.error || 'Upload failed'));

        statusEl.textContent = 'Saved! Open "View current saved CSV" to confirm.';
        statusEl.className = 'status ok';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'status err';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
